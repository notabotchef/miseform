name: Full checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt 'pypdf>=4,<7' 'formulas>=1.3,<2'
      # LibreOffice supplies the native Calc that recalculates the workbook
      # formulas, and poppler supplies pdftotext for the PDF text layer.
      # Without them the release-critical Calc regressions cannot run.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-calc poppler-utils
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capability_check.py
      - run: python -m pytest tests/ -q
      - run: python scripts/release_package.py --outdir '${{ runner.temp }}/miseform-release'
